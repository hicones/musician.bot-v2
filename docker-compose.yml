services:
  lavalink:
    build: ./lavalink
    container_name: musician-lavalink
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - _JAVA_OPTIONS=-Xmx1G
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"
    networks:
      - musician-net

  musician-bot:
    build: .
    container_name: musician-bot-v2
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - LAVALINK_HOST=lavalink:2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - DATABASE_PATH=/app/data/database.sqlite
      - BANNER_PATH=/app/assets/banner.png
      - PLACEHOLDER_PATH=/app/assets/placeholder.png
    volumes:
      - ./data:/app/data
    networks:
      - musician-net

networks:
  musician-net:
    driver: bridge

volumes:
  lavalink-plugins:

